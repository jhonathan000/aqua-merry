name: Deploy to Vercel on push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Deploy Hook
        run: |
          curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_cfaqLFaT9LdXxvgt9hhaV59YPvTQ/g2QZljWvRS"
          echo "Vercel deploy triggered!"
